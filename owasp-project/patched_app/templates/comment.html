<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Secure Comments (Patched)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white p-10">

  <div class="max-w-2xl mx-auto bg-gray-800 p-10 rounded-3xl shadow-xl">

    <h1 class="text-4xl font-bold mb-6 flex items-center gap-3">
      💬 Secure Comments <span class="text-yellow-400 text-2xl">(XSS Patched)</span>
    </h1>

    <!-- CSRF token MUST be inside form -->
    <form method="post" class="space-y-5">

      {{ csrf_token() }}

      <input 
        name="user" 
        placeholder="Your name"
        class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      >

      <textarea 
        name="comment" 
        placeholder="Write your comment..."
        class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 h-32 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      ></textarea>

      <button 
        class="w-full bg-yellow-600 hover:bg-yellow-700 p-4 rounded-xl text-xl font-bold shadow-md transition">
        Submit
      </button>

    </form>

    <h2 class="text-3xl mt-10 mb-4 font-semibold">Recent Comments</h2>

    <ul class="space-y-3">
      {% for c in comments %}
        <li class="bg-gray-700 p-4 rounded-lg shadow">
          <strong>{{ c[0] }}</strong>: {{ c[1] }}
        </li>
      {% endfor %}
    </ul>

    <a href="/" class="text-blue-400 mt-6 block text-lg">⬅ Back</a>

  </div>

</body>
</html>
