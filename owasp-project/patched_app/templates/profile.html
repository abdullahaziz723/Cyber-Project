<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Secure Profile (CSRF Protected)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white p-10">

  <div class="max-w-2xl mx-auto bg-gray-800 p-10 rounded-3xl shadow-xl">

    <h1 class="text-4xl font-bold mb-6 flex items-center gap-3">
      🔐 Secure Profile <span class="text-green-400 text-2xl">(CSRF Protected)</span>
    </h1>

    <!-- Correct usage of CSRF token -->
    <form method="post" class="space-y-5">
       
      
      {{ csrf_token() }}
     

      <textarea 
        name="bio" 
        placeholder="Update bio..."
        class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 h-32 focus:outline-none focus:ring-2 focus:ring-green-500"
      ></textarea>

      <button 
        class="w-full bg-green-600 hover:bg-green-700 p-4 rounded-xl text-xl font-bold shadow-md transition">
        Update Profile
      </button>

    </form>

    <a href="/" class="text-blue-400 mt-6 block text-lg">⬅ Back</a>

  </div>

</body>
</html>
