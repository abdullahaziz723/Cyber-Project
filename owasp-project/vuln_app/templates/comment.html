<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stored XSS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">

  <div class="max-w-xl mx-auto bg-gray-800 p-8 rounded-xl shadow-lg">

    <h1 class="text-3xl font-bold mb-6">💬 Stored XSS (Vulnerable)</h1>

    <form method="post" class="space-y-4">

      <input name="user" placeholder="Your name"
        class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600">

      <textarea name="comment" placeholder="Write a comment (Try XSS payload)"
      class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600"></textarea>

      <button class="w-full bg-yellow-600 p-3 rounded-lg font-bold text-xl">
        Post Comment
      </button>

    </form>

    <h2 class="text-2xl font-semibold mt-6 mb-2">Recent Comments</h2>

    <ul class="space-y-2">
      {% for c in comments %}
        <li class="bg-gray-700 p-3 rounded-lg">
          <strong>{{ c[0] }}</strong>: {{ c[1] | safe }}
        </li>
      {% endfor %}
    </ul>

    <a href="/" class="text-blue-400 mt-4 block">⬅ Back</a>

  </div>

</body>
</html>
